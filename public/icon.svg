<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App rounded background container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner cheerful ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#FEF3C7" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Playful central star -->
  <path d="M 256,90 
           L 296,190 
           L 404,198 
           L 322,270 
           L 348,376 
           L 256,318 
           L 164,376 
           L 190,270 
           L 108,198 
           L 216,190 Z"
        fill="url(#starGrad)"
        stroke="#CA8A04"
        stroke-width="8"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Friendly Happy Face on the Star -->
  <!-- Eyes -->
  <circle cx="225" cy="235" r="14" fill="#78350F" />
  <circle cx="229" cy="231" r="5" fill="#FFFFFF" />
  <circle cx="287" cy="235" r="14" fill="#78350F" />
  <circle cx="291" cy="231" r="5" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="205" cy="252" rx="12" ry="7" fill="#F43F5E" opacity="0.6" />
  <ellipse cx="307" cy="252" rx="12" ry="7" fill="#F43F5E" opacity="0.6" />

  <!-- Smile -->
  <path d="M 234,260 Q 256,282 278,260" fill="none" stroke="#78350F" stroke-width="7" stroke-linecap="round" />

  <!-- Lumi Title Badge -->
  <g transform="translate(256, 435)">
    <rect x="-100" y="-36" width="200" height="52" rx="26" fill="#FFFFFF" filter="url(#shadow)" />
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#B45309" letter-spacing="1">LUMI • لُومِي</text>
  </g>
</svg>
